<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-primary);padding:20px;-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .mfr-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) var(--mfr-badge-fill),transparent)}
  .spec-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--c,var(--text-muted));background:color-mix(in srgb,var(--c,var(--text-muted)) 15%,transparent)}
  .sw{border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}
  .lbl{font-size:10px;color:var(--text-muted);margin-top:5px}
  .val{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}
  
  .ln{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border-subtle)}
  .ln:first-child{border-top:none}
  .ll{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary)}
  .ll .dt{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .tk{position:relative;height:18px;background:linear-gradient(to right,transparent,color-mix(in srgb,var(--border-subtle) 50%,transparent) 50%,transparent);border-radius:999px}
  .z{position:absolute;top:50%;height:7px;transform:translateY(-50%);border-radius:999px;background:var(--c)}
  .p{position:absolute;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;background:var(--c);border:2px solid var(--bg-surface)}

</style>
</head>
<body>
<div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:10px;padding:14px 16px">
  <div class="ln"><div class="ll" style="--c:var(--mfr-fujinon)"><span class="dt"></span>Fujinon</div><div class="tk"><span class="z" style="--c:var(--mfr-fujinon);left:20%;width:30%"></span><span class="p" style="--c:var(--mfr-fujinon);left:62%"></span></div></div><div class="ln"><div class="ll" style="--c:var(--mfr-sigma)"><span class="dt"></span>Sigma</div><div class="tk"><span class="z" style="--c:var(--mfr-sigma);left:8%;width:34%"></span><span class="p" style="--c:var(--mfr-sigma);left:64%"></span></div></div><div class="ln"><div class="ll" style="--c:var(--mfr-tamron)"><span class="dt"></span>Tamron</div><div class="tk"><span class="z" style="--c:var(--mfr-tamron);left:6%;width:52%"></span></div></div>
</div></body></html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-primary);padding:20px;-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .mfr-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) var(--mfr-badge-fill),transparent)}
  .spec-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--c,var(--text-muted));background:color-mix(in srgb,var(--c,var(--text-muted)) 15%,transparent)}
  .sw{border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}
  .lbl{font-size:10px;color:var(--text-muted);margin-top:5px}
  .val{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}
  
  .bd{position:relative;height:34px;border-radius:7px;border:1px solid var(--border-subtle);background:repeating-linear-gradient(-45deg,transparent 0 7px,color-mix(in srgb,var(--danger) 14%,transparent) 7px 8px);overflow:hidden}
  .cv{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--kit) 30%,transparent);border-left:1px solid color-mix(in srgb,var(--kit) 55%,transparent);border-right:1px solid color-mix(in srgb,var(--kit) 55%,transparent)}
  .gap{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-family:var(--font-mono);font-size:11px;color:var(--danger);background:var(--danger-bg)}

</style>
</head>
<body>
<div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:10px;padding:16px">
  <div style="font-size:13px;font-weight:600;margin-bottom:10px">Focal coverage · 18–56mm</div>
  <div class="bd"><span class="cv" style="left:14%;width:30%"></span><span class="cv" style="left:60%;width:5%"></span></div>
  <div class="row" style="gap:8px;margin-top:12px"><span class="gap">gap 90–150mm →</span></div>
</div></body></html>

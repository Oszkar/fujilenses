<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-primary);padding:20px;-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .mfr-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) var(--mfr-badge-fill),transparent)}
  .spec-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--c,var(--text-muted));background:color-mix(in srgb,var(--c,var(--text-muted)) 15%,transparent)}
  .sw{border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}
  .lbl{font-size:10px;color:var(--text-muted);margin-top:5px}
  .val{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}
  
</style>
</head>
<body>
<div class="row" style="gap:8px;margin-bottom:14px">
  <span class="mfr-badge" style="--c:var(--mfr-fujinon)">Fujinon</span>
  <span class="mfr-badge" style="--c:var(--mfr-sigma)">Sigma</span>
  <span class="mfr-badge" style="--c:var(--mfr-viltrox)">Viltrox</span>
  <span class="mfr-badge" style="--c:var(--mfr-voigtlander)">Voigtländer</span>
  <span class="mfr-badge" style="--c:var(--mfr-tamron)">Tamron</span>
  <span class="mfr-badge" style="--c:var(--mfr-sirui)">Sirui</span>
  <span class="mfr-badge" style="--c:var(--mfr-ttartisan)">TTArtisan</span>
</div>
<div class="row" style="gap:7px">
  <div class="sw" style="width:44px;height:44px;border-radius:50%;background:var(--mfr-fujinon)"></div><div class="sw" style="width:44px;height:44px;border-radius:50%;background:var(--mfr-sigma)"></div><div class="sw" style="width:44px;height:44px;border-radius:50%;background:var(--mfr-viltrox)"></div><div class="sw" style="width:44px;height:44px;border-radius:50%;background:var(--mfr-voigtlander)"></div><div class="sw" style="width:44px;height:44px;border-radius:50%;background:var(--mfr-tamron)"></div><div class="sw" style="width:44px;height:44px;border-radius:50%;background:var(--mfr-sirui)"></div><div class="sw" style="width:44px;height:44px;border-radius:50%;background:var(--mfr-ttartisan)"></div>
</div>
<div class="lbl" style="margin-top:12px">One OKLCH family · shared L &amp; C · hue varies</div></body></html>

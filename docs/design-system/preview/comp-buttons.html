<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-primary);padding:20px;-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .mfr-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) var(--mfr-badge-fill),transparent)}
  .spec-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--c,var(--text-muted));background:color-mix(in srgb,var(--c,var(--text-muted)) 15%,transparent)}
  .sw{border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}
  .lbl{font-size:10px;color:var(--text-muted);margin-top:5px}
  .val{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}
  
  .b{height:34px;padding:0 16px;border-radius:var(--radius-md);border:1px solid transparent;font-family:var(--font-sans);font-weight:500;font-size:13px;cursor:pointer}
  .bp{background:var(--accent);color:var(--text-on-accent)}
  .bs{background:var(--bg-surface);border-color:var(--border-default);color:var(--text-primary)}
  .bg{background:transparent;color:var(--text-secondary)}
  .bd{background:var(--danger-bg);color:var(--danger)}

</style>
</head>
<body><div class="row">
  <button class="b bp">Add to My Kit</button>
  <button class="b bs">Clear filters</button>
  <button class="b bg">Cancel</button>
  <button class="b bd">Remove</button>
</div></body></html>

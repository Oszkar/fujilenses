<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-primary);padding:20px;-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .mfr-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) var(--mfr-badge-fill),transparent)}
  .spec-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--c,var(--text-muted));background:color-mix(in srgb,var(--c,var(--text-muted)) 15%,transparent)}
  .sw{border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}
  .lbl{font-size:10px;color:var(--text-muted);margin-top:5px}
  .val{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}
  
</style>
</head>
<body><div class="row" style="align-items:flex-end;gap:14px">
<div class="col" style="gap:0;align-items:center"><div style="width:4px;height:4px;background:var(--accent);border-radius:3px;opacity:.85"></div><div class="val" style="margin-top:6px">4</div></div><div class="col" style="gap:0;align-items:center"><div style="width:8px;height:8px;background:var(--accent);border-radius:3px;opacity:.85"></div><div class="val" style="margin-top:6px">8</div></div><div class="col" style="gap:0;align-items:center"><div style="width:12px;height:12px;background:var(--accent);border-radius:3px;opacity:.85"></div><div class="val" style="margin-top:6px">12</div></div><div class="col" style="gap:0;align-items:center"><div style="width:16px;height:16px;background:var(--accent);border-radius:3px;opacity:.85"></div><div class="val" style="margin-top:6px">16</div></div><div class="col" style="gap:0;align-items:center"><div style="width:24px;height:24px;background:var(--accent);border-radius:3px;opacity:.85"></div><div class="val" style="margin-top:6px">24</div></div><div class="col" style="gap:0;align-items:center"><div style="width:32px;height:32px;background:var(--accent);border-radius:3px;opacity:.85"></div><div class="val" style="margin-top:6px">32</div></div><div class="col" style="gap:0;align-items:center"><div style="width:48px;height:48px;background:var(--accent);border-radius:3px;opacity:.85"></div><div class="val" style="margin-top:6px">48</div></div><div class="col" style="gap:0;align-items:center"><div style="width:64px;height:64px;background:var(--accent);border-radius:3px;opacity:.85"></div><div class="val" style="margin-top:6px">64</div></div>
</div><div class="lbl" style="margin-top:12px">4px base grid</div></body></html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-primary);padding:20px;-webkit-font-smoothing:antialiased}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .mfr-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) var(--mfr-badge-fill),transparent)}
  .spec-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-weight:500;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--c,var(--text-muted));background:color-mix(in srgb,var(--c,var(--text-muted)) 15%,transparent)}
  .sw{border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}
  .lbl{font-size:10px;color:var(--text-muted);margin-top:5px}
  .val{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}
  
</style>
</head>
<body>
<div class="row" style="gap:14px;margin-bottom:16px">
  <div class="col" style="gap:0;align-items:center"><div style="width:52px;height:52px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:3px"></div><div class="val" style="margin-top:6px">xs</div></div><div class="col" style="gap:0;align-items:center"><div style="width:52px;height:52px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:5px"></div><div class="val" style="margin-top:6px">sm</div></div><div class="col" style="gap:0;align-items:center"><div style="width:52px;height:52px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:7px"></div><div class="val" style="margin-top:6px">md</div></div><div class="col" style="gap:0;align-items:center"><div style="width:52px;height:52px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:10px"></div><div class="val" style="margin-top:6px">lg</div></div><div class="col" style="gap:0;align-items:center"><div style="width:52px;height:52px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:14px"></div><div class="val" style="margin-top:6px">xl</div></div>
</div>
<div class="row" style="gap:22px">
  <div style="width:90px;height:48px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:10px;box-shadow:var(--shadow-sm);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">sm</div><div style="width:90px;height:48px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:10px;box-shadow:var(--shadow-md);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">md</div><div style="width:90px;height:48px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:10px;box-shadow:var(--shadow-lg);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">lg</div>
</div></body></html>

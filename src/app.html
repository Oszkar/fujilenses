<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<meta name="theme-color" content="#0F1318" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			(function() {
				var t = localStorage.getItem('fujilenses-theme');
				if (t) document.documentElement.setAttribute('data-theme', t);
				var s = localStorage.getItem('fujilenses-font-size');
				var map = { s: '0.875', m: '1', l: '1.125' };
				if (s && map[s]) document.documentElement.style.setProperty('--font-scale', map[s]);
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
